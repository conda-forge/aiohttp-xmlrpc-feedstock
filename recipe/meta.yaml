{% set name = "aiohttp-xmlrpc" %}
{% set version = "1.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/aiohttp-xmlrpc-{{ version }}.tar.gz
  sha256: 85b7659e91161a7c82280eeb0a2e9f06e95f858df1a4f6f68c737b675664dbed

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - aiohttp
    - lxml
    - python >={{ python_min }}

test:
  imports:
    - aiohttp_xmlrpc
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mosquito/aiohttp-xmlrpc
  summary: aiohttp XML-RPC server handler and client
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - thewchan
